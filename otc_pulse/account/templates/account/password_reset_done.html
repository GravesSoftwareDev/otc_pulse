{% extends 'base.html' %}

{% block title %}Reset Link Sent | OTCPulse{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card auth-card-centered">
        <div class="auth-success-icon">🔒</div>
        <h1>Need a Password Reset?</h1>
        <p class="auth-subtitle">Password resets are handled by Student Engagement. Reach out and they'll get you back in.</p>
        <div style="margin: 1.5rem 0;">
            <a class="btn btn-primary btn-full"
               href="#"
               data-u="gravess"
               data-d="otc.edu"
               data-sub="OTCPulse%20Password%20Reset%20Request"
               onclick="this.href='mailto:'+this.dataset.u+'@'+this.dataset.d+'?subject='+this.dataset.sub; return true;">
                Email Student Engagement
            </a>
        </div>
        <p class="auth-footer">
            <a href="{% url 'account:login' %}">Back to Log In</a>
        </p>
    </div>
</div>
{% endblock %}
